name: iot-cps

services:
  postgres:
    image: postgres:16-alpine
    container_name: iot-cps-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iot_monitoring
    volumes:
      - iot_pg_data:/var/lib/postgresql/data

volumes:
  iot_pg_data:
